name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Create artifact
        run: |
          cd dist
          zip -r "../mynumber-generator-${GITHUB_REF_NAME}.zip" .
      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes "mynumber-generator-${GITHUB_REF_NAME}.zip"
        env:
          GH_TOKEN: ${{ github.token }}
